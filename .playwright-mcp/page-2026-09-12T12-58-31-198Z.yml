        - paragraph [ref=f2e86]: Sıdıka Şire is a businessperson and civil society leader based in Adana. She serves as President for Türkiye of the International Federation for Businessmen and Women (IFB), Turkish Union President of the International Federation of Businessmen and Investors Associations (IFBI), and Chairwoman of the Board of the Iraq and Middle East Businesswomen and Businessmen Association. Her work centres on trade relations between Türkiye and Iraq, investor matchmaking, and womens entrepreneurship. She has worked for more than ten years across business associations, trade development and civil society.
