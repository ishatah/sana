    - generic [ref=f11e72]:
      - heading "السيرة الكاملة" [level=2] [ref=f11e74]
      - generic [ref=f11e75]:
        - paragraph [ref=f11e76]: سناء رقيق سيدة أعمال ومتخصصة في تطوير الأعمال، ولديها خبرة واسعة في الشراكات الاستراتيجية والتطوير التجاري الدولي وقطاع العقارات. وقد تمكنت خلال مسيرتها المهنية من بناء شبكة علاقات قوية تمتد عبر أوروبا والشرق الأوسط، مكنتها من الربط بين رجال الأعمال والمستثمرين وصناع القرار، وخلق فرص واعدة للتعاون طويل الأمد.
        - paragraph [ref=f11e77]: تتخصص في تطوير الأعمال، واستقطاب العملاء، وبناء العلاقات الاستراتيجية، وإدارة الشراكات، وتحديد الفرص التجارية الواعدة. وتحرص دائمًا على الجمع بين الأطراف المناسبة، وبناء شراكات قائمة على الثقة، ودعم المؤسسات في تحقيق نمو مستدام من خلال علاقات عمل ذات قيمة حقيقية.
        - paragraph [ref=f11e78]: وتمثل مجلس الأعمال الدولي (IBC) بصفتها مستشارة وممثلة استراتيجية، حيث تسهم في تعزيز العلاقات التجارية الدولية من خلال الربط بين رواد الأعمال والشركات والمستثمرين والمؤسسات في مختلف القطاعات. ويتركز دورها على تيسير الشراكات الاستراتيجية، وتشجيع التعاون العابر للحدود، ودعم المبادرات التي تسهم في خلق قيمة اقتصادية مستدامة.
        - paragraph [ref=f11e79]: وإلى جانب نشاطها الاستشاري فهي شريكة في مشروعين تجاريين قائمين.
